# Compila el sitio y lo sube a Hostinger por FTP en cada push a main.
# Las credenciales están en Settings → Secrets and variables → Actions.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Subir dist/ a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # El certificado del servidor es de Hostinger (*.hstgr.io), no del dominio.
          security: loose
          local-dir: ./dist/
          # La cuenta FTP ya arranca dentro de public_html/qr-word-generator.
          server-dir: ./
