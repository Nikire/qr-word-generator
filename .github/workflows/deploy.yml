# Compila el sitio y lo sube a Hostinger por FTP en cada push a main.
# Las credenciales están en Settings → Secrets and variables → Actions.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Clave del panel de estadísticas (/panel/): al servidor solo va su huella.
      - name: Configurar el panel de estadísticas
        env:
          STATS_KEY: ${{ secrets.STATS_KEY }}
        run: |
          if [ -n "$STATS_KEY" ]; then
            huella=$(printf '%s' "$STATS_KEY" | sha256sum | cut -d' ' -f1)
            printf "<?php\nreturn ['key_sha256' => '%s'];\n" "$huella" > dist/api/config.php
          fi

      # Según la cuenta FTP, la sesión arranca dentro de public_html o un nivel arriba.
      - name: Detectar carpeta de destino
        id: destino
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          listado=$(curl -sS --ssl-reqd -k --list-only --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/" | tr -d '\r')
          if printf '%s\n' "$listado" | grep -qx 'public_html'; then
            echo "dir=./public_html/" >> "$GITHUB_OUTPUT"
          else
            echo "dir=./" >> "$GITHUB_OUTPUT"
          fi

      - name: Subir dist/ a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # El certificado del servidor es de Hostinger (*.hstgr.io), no del dominio.
          security: loose
          local-dir: ./dist/
          server-dir: ${{ steps.destino.outputs.dir }}
